[package]
name = "easyhttpmock"
version = "0.1.5-beta.2"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EasyHttpMock is a simple HTTP mock server for testing HTTP clients."
readme = "README.md"
license.workspace = true
keywords = ["http", "mock", "testing"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["multi-threaded", "json", "xml"]
multi-threaded = []
single-threaded = []
json = ["dep:sonic-rs", "dep:serde_json", "dep:jsonpath-rust"]
xml = ["dep:simdxml", "dep:serde", "dep:serde-xml-rs"]

[dependencies]
bytes = { version = "1.12.1", default-features = false }
caramelo = { workspace = true }
http = { workspace = true }
jsonpath-rust = { version = "1.0.12", optional = true }
regex = { version = "1.12.4", default-features = false }
serde = { version = "1.0.219", optional = true }
serde-xml-rs = { version = "0.8.2", optional = true }
serde_json = { version = "1.0.150", optional = true }
simdxml = { version = "0.2.1", optional = true }
sonic-rs = { version = "0.5.10", optional = true }
thiserror = "2.0.17"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
