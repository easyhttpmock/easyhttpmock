[package]
name = "easyhttpmock-vetis-compio"
version = "0.1.2"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EasyHttpMock adapter for Vetis HTTP server using compio runtime."
readme = "README.md"
license.workspace = true
keywords = ["http", "mock", "testing"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = [
  "http1",
  "http2",
  #"http3"
]

xml = ["easyhttpmock/xml"]
json = ["easyhttpmock/json"]
http1 = ["vetis-compio/http1"]
http2 = ["vetis-compio/http2"]
http3 = ["vetis-compio/http3"]

rust-tls = ["vetis-compio/rust-tls"]

[dependencies]
caramelo = { workspace = true }
easyhttpmock = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
rand = { workspace = true, default-features = false }
compio = { version = "0.19.2", default-features = false, features = ["macros"] }
vetis-compio = { version = "0.1.0", features = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
], default-features = false }
send_wrapper = "0.6.0"

[dev-dependencies]
deboa = { workspace = true }
deboa-compio = { version = "0.1.0", default-features = false, features = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
compio = { version = "0.19.2", default-features = false, features = ["macros"] }
