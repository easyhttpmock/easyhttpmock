[workspace]
# Use the latest resolver available
resolver = "3"
# Include both parts of the library in the workspace
members = [
  "easyhttpmock",
  #"easyhttpmock-vetis-compio",
  "easyhttpmock-vetis-smol",
  "easyhttpmock-vetis-tokio",
  #"examples/simple"
]

[workspace.package]
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/easyhttpmock"
homepage = "https://github.com/ararog/easyhttpmock"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.75.0"

[workspace.dependencies]
caramelo = { version = "0.1.2" }
deboa = { version = ">= 0.1.0" }
easyhttpmock = { version = ">= 0.1.3", path = "easyhttpmock" }
http = "1.5.0"
http-body-util = "0.1.5"
rand = { version = "0.10.2", default-features = false }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
